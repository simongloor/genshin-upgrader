server {
    server_name hoyo-upgrader-frontend.loc;

    root /usr/share/nginx/html;
    index index.php index.html index.htm;
    
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/*.pillars.ch.cer;
    ssl_certificate_key /etc/nginx/certs/*.pillars.ch.key;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
        add_header Cache-Control "public, max-age=1209600, must-revalidate";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
